model:
  # Persistent output of the one-time W4 -> NF4 conversion. The same directory
  # is loaded by managed vLLM rollout and by FSDP-QLoRA training.
  name_or_path: /kaggle/working/models/gemma-4-31b-nf4
  trust_remote_code: false
  torch_dtype: bfloat16
  load_mode: nf4
  device_map: null

distributed:
  strategy: fsdp
  num_processes: 4
  # 31B NF4 is sharded across four L4s; avoid slow PCIe CPU parameter offload.
  cpu_offload: false
  limit_all_gathers: true

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: all-linear

grpo:
  learning_rate: 5.0e-6
  beta: 0.01
  clip_epsilon: 0.2
  group_size: 4
  epochs: 2
  max_steps: null
  max_seq_length: 32768
  logprob_chunk_size: 32
  max_grad_norm: 1.0
  seed: 42
  monitor_interval_seconds: 5
  monitor_console_seconds: 30

rollout:
  # Kaggle notebooks do not expose a Docker daemon. SWEGemma's subprocess
  # sandbox provides the supported isolated runner for this environment.
  sandbox: subprocess
  # null uses the image configured by the installed competition harness.
  image: null
  concurrency: 1
  max_tool_calls: 20
  max_time_minutes: 15
  # Kept in submission/eval_config.yaml; null avoids relying on a version-specific CLI flag.
  timeout_seconds: null
  seeds: [101, 202, 303, 404]
  # The loop owns vLLM: it streams byte views from the shared BF16-storage NF4
  # checkpoint, then stops before spawning four FSDP ranks on the same files.
  managed_vllm: true
  vllm_port: 8000
  # Pre-quantized BNB uses pipeline rather than tensor parallelism in vLLM 0.19.
  vllm_tensor_parallel_size: 1
  vllm_pipeline_parallel_size: 4
  vllm_gpu_memory_utilization: 0.9
  vllm_startup_timeout_seconds: 900

reward:
  resolved: 1.0
  failed: 0.0
  empty_patch: -0.25
  # Applied only to resolved trajectories, so all-failure groups do not learn
  # merely to stop earlier.
  tool_call_penalty: 0.002

