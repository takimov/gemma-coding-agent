model:
  name_or_path: /kaggle/working/models/gemma-4-31b-nf4
  trust_remote_code: false
  torch_dtype: bfloat16
  load_mode: nf4
  device_map: null

distributed:
  strategy: fsdp
  num_processes: 4
  cpu_offload: false
  limit_all_gathers: true

lora:
  # Keep the adapter architecture identical to configs/sft.yaml so a successful
  # one-step smoke can be resumed instead of discarded.
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: '.*vision_tower.*'

sft:
  learning_rate: 1.0e-5
  epochs: 1
  max_steps: 1
  max_seq_length: 8192
  logprob_chunk_size: 32
  max_grad_norm: 1.0
  seed: 42
  max_examples_per_task: 2
  monitor_interval_seconds: 5
  monitor_console_seconds: 20

grpo:
  group_size: 4
rollout:
  seeds: [101, 202, 303, 404]
