model:
  name_or_path: /path/to/model
  trust_remote_code: false
  torch_dtype: bfloat16
  # The competition compressed-tensors checkpoint is staged/decompressed on
  # CPU and requantized layer-by-layer to trainable bitsandbytes NF4.
  load_mode: bnb4
  device_map: balanced
  max_memory_per_gpu_gib: 22
  # GPU 0 also owns embeddings/lm_head and receives every vocabulary
  # projection, so leave it more activation headroom than the layer GPUs.
  gpu0_reserve_gib: 8
  other_gpu_reserve_gib: 4
lora:
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: all-linear
grpo:
  learning_rate: 5.0e-6
  beta: 0.01
  clip_epsilon: 0.2
  group_size: 2
  epochs: 1
  max_steps: 1
  # The two-rollout smoke task currently produces ~6.5k-7.7k token traces.
  max_seq_length: 8192
  # Bounds temporary lm_head/log-softmax memory to roughly tens of MiB.
  logprob_chunk_size: 32
  max_grad_norm: 1.0
  seed: 42
  monitor_interval_seconds: 5
  monitor_console_seconds: 20
rollout:
  # Kaggle notebooks do not expose a Docker daemon. SWEGemma's subprocess
  # sandbox provides the supported isolated runner for this environment.
  sandbox: subprocess
  image: null
  concurrency: 1
  max_tool_calls: 5
  max_time_minutes: 5
  timeout_seconds: null
  seeds: [101, 202]
reward:
  resolved: 1.0
  failed: 0.0
  empty_patch: -0.25
  tool_call_penalty: 0.0

