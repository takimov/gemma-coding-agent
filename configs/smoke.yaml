model:
  name_or_path: /kaggle/working/models/gemma-4-31b-nf4
  trust_remote_code: false
  torch_dtype: bfloat16
  # Must be the persistent output of `gemma-grpo convert-nf4`.
  load_mode: nf4
  device_map: null
distributed:
  strategy: fsdp
  num_processes: 4
  cpu_offload: false
  limit_all_gathers: true
lora:
  r: 8
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  # vLLM serves only the language backbone; do not emit incompatible vision LoRA weights.
  exclude_modules: '.*vision_tower.*'
grpo:
  learning_rate: 5.0e-6
  beta: 0.01
  clip_epsilon: 0.2
  group_size: 4
  epochs: 1
  max_steps: 1
  # The smoke task currently produces ~6.5k-7.7k token traces.
  max_seq_length: 8192
  # Bounds temporary lm_head/log-softmax memory to roughly tens of MiB.
  logprob_chunk_size: 32
  max_grad_norm: 1.0
  seed: 42
  monitor_interval_seconds: 5
  monitor_console_seconds: 20
rollout:
  # Kaggle notebooks do not expose a Docker daemon. SWEGemma's subprocess
  # sandbox provides the supported isolated runner for this environment.
  sandbox: subprocess
  image: null
  concurrency: 1
  # The earlier 5-call smoke exhausted its budget before submit_patch and
  # produced only empty patches. Keep the real agent budget for a trainable group.
  max_tool_calls: 20
  max_time_minutes: 10
  timeout_seconds: null
  seeds: [101, 202, 303, 404]
  managed_vllm: true
  # Roll out with the official inference-optimized QAT W4A16 checkpoint passed
  # via --rollout-model-path; FSDP still trains model.name_or_path in NF4.
  vllm_checkpoint_format: compressed-tensors
  vllm_port: 8000
  # Native compressed-tensors supports fast tensor parallel inference.
  vllm_tensor_parallel_size: 4
  vllm_pipeline_parallel_size: 1
  # SWEGemma coding tasks are text-only; do not instantiate the vision tower.
  vllm_language_model_only: true
  # SWEGemma requests up to 16k completion tokens.  Keep rollout context
  # independent from the smaller 8k training filter used by this smoke test.
  vllm_max_model_len: 32768
  # Native W4 has enough headroom for CUDA graphs on four L4 shards.
  vllm_max_num_seqs: 1
  vllm_enforce_eager: false
  vllm_gpu_memory_utilization: 0.9
  vllm_startup_timeout_seconds: 900
reward:
  resolved: 1.0
  failed: 0.0
  empty_patch: -0.25
  tool_call_penalty: 0.0

