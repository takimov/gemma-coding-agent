model:
  # Student checkpoint. Teacher traces are retokenized with this Gemma tokenizer
  # during the later SFT stage; Qwen is passed separately to collect --model-path.
  name_or_path: /kaggle/working/models/gemma-4-31b-nf4
  trust_remote_code: false
  torch_dtype: bfloat16
  load_mode: nf4
  device_map: null

distributed:
  strategy: fsdp
  num_processes: 4
  cpu_offload: false
  limit_all_gathers: true

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_modules: '.*vision_tower.*'

grpo:
  group_size: 4

sft:
  learning_rate: 1.0e-5
  epochs: 2
  max_steps: null
  max_seq_length: 8192
  logprob_chunk_size: 32
  max_grad_norm: 1.0
  seed: 42
  max_examples_per_task: 2
  monitor_interval_seconds: 5
  monitor_console_seconds: 30

rollout:
  sandbox: subprocess
  image: null
  concurrency: 4
  max_tool_calls: 50
  max_time_minutes: 15
  timeout_seconds: null
  seeds: [101, 202, 303, 404]
  managed_vllm: true
  vllm_checkpoint_format: compressed-tensors
  vllm_served_model_name: qwen3-coder-next-teacher
  vllm_tool_call_parser: qwen3_coder
  # Qwen3-Coder-Next is explicitly a non-thinking model, so do not enable a
  # reasoning parser.  SWEGemma/ADK nevertheless sends thinking_token_budget
  # on every request.  vLLM 0.19 rejects that field unless reasoning_config is
  # present, so configure Qwen's real delimiter tokens as a compatibility shim.
  # They do not turn thinking on and do not split ordinary model output.
  vllm_reasoning_parser: null
  vllm_reasoning_start_str: "<think>"
  vllm_reasoning_end_str: "</think>"
  vllm_enable_thinking: false
  preserve_trace_token_ids: false
  vllm_port: 8000
  vllm_tensor_parallel_size: 4
  vllm_pipeline_parallel_size: 1
  vllm_language_model_only: false
  vllm_max_model_len: 32768
  vllm_max_num_seqs: 4
  vllm_enforce_eager: false
  vllm_gpu_memory_utilization: 0.90
  vllm_startup_timeout_seconds: 1200

reward:
  resolved: 1.0
  failed: 0.0
  empty_patch: -0.25
  tool_call_penalty: 0.0
